name: Build image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".tekton/**"
      - ".gitlab-ci.yml"
      - "renovate.json"
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest to build (fedora-standard, fedora-minimal, ...)"
        default: fedora-standard

concurrency:
  group: build-image
  # A newer commit supersedes an in-flight build
  cancel-in-progress: true

env:
  IMAGE: docker.io/typicalam/fedora-bootc
  MANIFEST: ${{ inputs.manifest || 'fedora-standard' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    # Ubuntu's podman 4.9 is too old for this Containerfile (rw bind mounts from
    # stages, oci-archive FROM), so build with a current podman. /mnt has much
    # more free space than / on hosted runners.
    container:
      image: quay.io/podman/stable:v5
      options: --privileged -v /mnt/containers:/var/lib/containers
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Use native overlayfs
        # The podman image defaults to fuse-overlayfs, which makes every layer
        # commit of this multi-GB rootfs crawl. We're root in a privileged
        # container, so kernel overlay works.
        run: |
          # fsync=0 in mountopt is fuse-overlayfs-only; the kernel rejects it
          sed -i -e '/^mount_program/d' -e 's/^mountopt = .*/mountopt = "nodev"/' /etc/containers/storage.conf
          podman info --format '{{.Store.GraphDriverName}} {{.Store.GraphOptions}}'

      - name: Compute tags
        id: meta
        run: |
          # Fedora release follows the REPOS_IMAGE default in the Containerfile
          version=$(sed -n 's|^ARG REPOS_IMAGE=quay.io/fedora/fedora:||p' Containerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build chunked image
        run: |
          podman build \
            --security-opt=label=disable --cap-add=all --device /dev/fuse \
            --no-cache --pull=always \
            --build-arg MANIFEST="$MANIFEST" \
            --build-arg FINAL=chunked --skip-unused-stages=false \
            -v "$PWD:/run/src" \
            -t "$IMAGE:${{ steps.meta.outputs.version }}" \
            -t "$IMAGE:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.date }}" \
            -t "$IMAGE:latest" \
            .

      - name: Lint image
        run: podman run --rm "$IMAGE:${{ steps.meta.outputs.version }}" bootc container lint

      - name: Push
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          echo "$REGISTRY_TOKEN" | podman login docker.io -u "$REGISTRY_USER" --password-stdin
          for tag in "${{ steps.meta.outputs.version }}" \
                     "${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.date }}" \
                     latest; do
            podman push "$IMAGE:$tag"
          done
