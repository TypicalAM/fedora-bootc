name: Build image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".tekton/**"
      - ".gitlab-ci.yml"
      - "renovate.json"
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest to build (fedora-standard, fedora-minimal, ...)"
        default: fedora-standard

concurrency:
  group: build-image
  # A newer commit supersedes an in-flight build
  cancel-in-progress: true

env:
  IMAGE: docker.io/typicalam/fedora-bootc
  MANIFEST: ${{ inputs.manifest || 'fedora-standard' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          # Fedora release follows the REPOS_IMAGE default in the Containerfile
          version=$(sed -n 's|^ARG REPOS_IMAGE=quay.io/fedora/fedora:||p' Containerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build chunked image
        run: |
          sudo podman build \
            --security-opt=label=disable --cap-add=all --device /dev/fuse \
            --no-cache --pull=always \
            --build-arg MANIFEST="$MANIFEST" \
            --build-arg FINAL=chunked --skip-unused-stages=false \
            -v "$PWD:/run/src" \
            -t "$IMAGE:${{ steps.meta.outputs.version }}" \
            -t "$IMAGE:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.date }}" \
            -t "$IMAGE:latest" \
            .

      - name: Lint image
        run: sudo podman run --rm "$IMAGE:${{ steps.meta.outputs.version }}" bootc container lint

      - name: Push
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | sudo podman login docker.io -u "$REGISTRY_USER" --password-stdin
          for tag in "${{ steps.meta.outputs.version }}" \
                     "${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.date }}" \
                     latest; do
            sudo podman push "$IMAGE:$tag"
          done
